services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fastapi_business_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # Mount host app directory for hot-reload in local development
      - ./app:/app/app:ro
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/api/v1/health\")'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
